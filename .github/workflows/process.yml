name: Processar planilha da Tolva

on:
  push:
    paths:
      - 'uploads/**'
  workflow_dispatch: {}

permissions:
  contents: write

# Um processamento por vez: se a planilha for salva duas vezes seguidas,
# o segundo espera o primeiro terminar (e usa a versão mais nova).
concurrency:
  group: processar-planilha-tolva
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: o script usa a data de envio de cada planilha

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Rodar script de leitura da planilha
        run: python scripts/parse_excel.py

      - name: Salvar dados gerados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualiza dados da Tolva [automático]"
          # se chegou uma planilha nova enquanto processava, junta antes de enviar
          git pull --rebase origin main
          git push
