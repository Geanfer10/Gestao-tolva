name: Processar planilha da Tolva

on:
  push:
    paths:
      - 'uploads/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  processar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Rodar script de leitura da planilha
        run: python scripts/parse_excel.py

      - name: Salvar dados gerados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Atualiza dados da Tolva [automático]"
          git push
